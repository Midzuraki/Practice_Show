name: Python checks

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q main database tests
      - name: Run alignment tests
        run: python -m unittest discover -s tests -v
      - name: Run full project tests
        run: python -m unittest discover -s database/scripts/test -v
