name: Python checks

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Python ${{ matrix.python-version }} — compile and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q main database tests
      - name: Run alignment tests
        run: python -m unittest discover -s tests -v
      - name: Run full project tests
        run: python -m unittest discover -s database/scripts/test -v
